<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Si-Kobar — Lapas Kelas IIB Tobelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Library HTML5 QR Code Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0A1628;
  --navy-mid:#1A2E4A;
  --navy-light:#2A4266;
  --gold:#C8963A;
  --gold-light:#E8B05A;
  --gold-pale:#FDF6E8;
  --cream:#F8F5EE;
  --white:#FFFFFF;
  --text:#1A1A2E;
  --muted:#6B7A99;
  --border:#E2E8F0;
  --success:#1A7A4A;
  --success-bg:#EAF7F0;
  --danger:#B91C1C;
  --danger-bg:#FEF2F2;
  --warn:#D97706;
  --warn-bg:#FEF3C7;
  --radius:12px;
  --shadow:0 2px 16px rgba(10,22,40,0.10);
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);font-size:15px}

/* ─── SCREENS ─── */
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ─── LOGIN ─── */
#screen-login{background:var(--navy);align-items:center;justify-content:center;padding:2rem}
.login-card{background:var(--white);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo .emblem{width:64px;height:64px;background:var(--navy);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:0.75rem}
.login-logo .emblem i{font-size:32px;color:var(--gold)}
.login-logo h1{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--navy);line-height:1.2}
.login-logo p{font-size:0.78rem;color:var(--muted);margin-top:0.25rem}
.login-tabs{display:flex;gap:8px;margin-bottom:1.5rem;background:var(--cream);border-radius:10px;padding:4px}
.login-tab{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:500;color:var(--muted);transition:all .2s}
.login-tab.active{background:var(--white);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,0.12)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field input, .field select, .field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:0.95rem;color:var(--text);background:var(--white);outline:none;transition:border .2s}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy)}
.field input:disabled, .field select:disabled, .field textarea:disabled{background:var(--cream);color:var(--navy);cursor:not-allowed;opacity:0.85;border-color:var(--border)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-navy{background:var(--navy);color:var(--white)}
.btn-navy:hover{background:var(--navy-mid)}
.btn-gold{background:var(--gold);color:var(--white)}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--border)}
.btn-outline:hover{background:var(--cream)}
.btn-sm{width:auto;padding:8px 16px;font-size:0.85rem;border-radius:8px}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #FECACA}
.btn-success{background:var(--success-bg);color:var(--success);border:1px solid #A7F3D0}
.btn-wa{background:#25D366;color:#fff}
.btn-wa:hover{background:#1DA851}

/* ─── TOPBAR ─── */
.topbar{background:var(--navy);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:10px;color:var(--white)}
.topbar-brand i{color:var(--gold);font-size:22px}
.topbar-brand span{font-family:'DM Serif Display',serif;font-size:1.1rem}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-user{font-size:0.8rem;color:rgba(255,255,255,0.6);text-align:right}
.topbar-user strong{display:block;color:var(--white);font-size:0.85rem}
.icon-btn{background:rgba(255,255,255,0.1);border:none;color:var(--white);width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,0.2)}

/* ─── PETUGAS DASHBOARD ─── */
#screen-petugas{background:var(--cream)}
.petugas-home{flex:1;padding:1.25rem}
.greeting-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);border-radius:var(--radius);padding:1.25rem;color:var(--white);margin-bottom:1rem;position:relative;overflow:hidden}
.greeting-card::after{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;background:rgba(200,150,58,0.15);border-radius:50%}
.greeting-card h2{font-family:'DM Serif Display',serif;font-size:1.3rem}
.greeting-card p{font-size:0.8rem;color:rgba(255,255,255,0.7);margin-top:4px}
.rupam-badge{display:inline-block;background:var(--gold);color:var(--white);font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px;letter-spacing:.05em}
.quick-action{background:var(--white);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;cursor:pointer;border:1.5px solid var(--border);transition:all .2s;display:flex;align-items:center;gap:1rem}
.quick-action:hover{border-color:var(--navy);box-shadow:var(--shadow)}
.qa-icon{width:52px;height:52px;border-radius:12px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qa-icon i{font-size:24px;color:var(--gold)}
.qa-text h3{font-size:0.95rem;font-weight:600;color:var(--navy)}
.qa-text p{font-size:0.78rem;color:var(--muted);margin-top:2px}
.section-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1.25rem 0 0.75rem}
.report-item{background:var(--white);border-radius:var(--radius);padding:1rem;margin-bottom:0.75rem;border:1px solid var(--border)}
.report-item-header{display:flex;justify-content:space-between;align-items:flex-start}
.report-item-title{font-size:0.9rem;font-weight:600;color:var(--navy)}
.report-item-sub{font-size:0.75rem;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:0.7rem;font-weight:600;padding:3px 10px;border-radius:20px}
.badge-aman{background:var(--success-bg);color:var(--success)}
.badge-kendala{background:var(--warn-bg);color:var(--warn)}
.badge-bahaya{background:var(--danger-bg);color:var(--danger)}

.info-waktu-lokasi {
  background-color: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 10px 15px;
  margin-top: 10px;
  margin-bottom: 15px;
  font-size: 13px;
  color: #475569;
}

.info-waktu-lokasi p {
  margin: 5px 0;
  font-weight: 500;
}

#realtime-clock, #realtime-location {
  font-weight: 700;
  color: #1a2e4a;
}

.weather-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(10,22,40,0.04);
}
.weather-info {
  display: flex;
  align-items: center;
  gap: 12px;
}
.weather-icon {
  font-size: 32px;
  color: var(--gold);
}
.weather-temp {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--navy);
  line-height: 1;
}
.weather-desc {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 3px;
  font-weight: 500;
}
.weather-location {
  font-size: 0.75rem;
  color: var(--muted);
  text-align: right;
  font-weight: 600;
  line-height: 1.3;
}

.team-roster-container {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 1rem;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.team-member-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  min-width: 130px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: all .2s;
}
.team-member-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--navy);
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-bottom: 6px;
  border: 2px solid var(--gold);
  overflow: hidden;
}
.team-member-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.team-member-name {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 110px;
}
.team-member-status {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 12px;
  margin-top: 4px;
}
.status-active {
  background: var(--success-bg);
  color: var(--success);
}
.status-pending {
  background: var(--cream);
  color: var(--muted);
}

/* ─── FORM ─── */
#screen-form{background:var(--cream)}
.form-body{flex:1;padding:1.25rem;overflow-y:auto}
.form-card{background:var(--white);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;border:1px solid var(--border)}
.form-section-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:0.75rem;display:flex;align-items:center;gap:6px}
.auto-field{background:var(--cream);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:0.75rem}
.auto-field i{color:var(--navy);font-size:18px;flex-shrink:0}
.auto-field-content{flex:1}
.auto-field-label{font-size:0.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.auto-field-value{font-size:0.88rem;font-weight:500;color:var(--text);margin-top:1px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:0.75rem}
.photo-slot{border:2px dashed var(--border);border-radius:10px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;background:var(--cream)}
.photo-slot:hover{border-color:var(--navy);background:rgba(10,22,40,0.03)}
.photo-slot.captured{border-style:solid;border-color:var(--success)}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
.photo-slot-overlay{position:absolute;inset:0;background:rgba(10,22,40,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--white);opacity:0}
.photo-slot.captured:hover .photo-slot-overlay{opacity:1}
.photo-label{font-size:0.72rem;font-weight:600;color:var(--muted);margin-top:6px}
.photo-icon{font-size:28px;color:var(--muted)}
.photo-slot.captured .photo-icon,.photo-slot.captured .photo-label{display:none}
.form-footer{padding:1rem 1.25rem;background:var(--white);border-top:1px solid var(--border)}
.status-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0.5rem}
.status-opt{padding:10px 8px;border:1.5px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all .2s;font-size:0.8rem;font-weight:500}
.status-opt.sel-aman{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.status-opt.sel-kendala{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.status-opt.sel-bahaya{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}

/* ─── CAMERA ─── */
#screen-camera{background:#000;align-items:center;justify-content:center}
.camera-view{position:relative;width:100%;max-width:480px;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#camera-preview{width:100%;height:100%;object-fit:cover}
.camera-frame{position:absolute;inset:20px;border:2px solid rgba(200,150,58,0.8);border-radius:12px;pointer-events:none}
.camera-label{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:var(--white);padding:6px 16px;border-radius:20px;font-size:0.8rem;font-weight:600;white-space:nowrap}
.camera-bottom{background:rgba(0,0,0,0.85);padding:1.5rem;display:flex;align-items:center;justify-content:space-around;width:100%;max-width:480px}
.shutter-btn{width:68px;height:68px;border-radius:50%;background:var(--white);border:4px solid rgba(255,255,255,0.5);cursor:pointer;transition:all .2s}
.shutter-btn:active{transform:scale(0.93)}
.camera-cancel{color:rgba(255,255,255,0.7);font-size:0.85rem;cursor:pointer;font-family:inherit;background:none;border:none;padding:8px}
.camera-hint{color:rgba(255,255,255,0.5);font-size:0.8rem;text-align:center}

/* ─── RESULT ─── */
#screen-result{background:var(--cream)}
.result-body{flex:1;padding:1.25rem;overflow-y:auto}
.result-success{background:var(--white);border-radius:var(--radius);padding:2rem;text-align:center;border:1px solid var(--border);margin-bottom:1rem}
.result-icon{width:64px;height:64px;border-radius:50%;background:var(--success-bg);display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem}
.result-icon i{font-size:32px;color:var(--success)}
.result-success h2{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--navy)}
.result-success p{font-size:0.85rem;color:var(--muted);margin-top:6px}
.pdf-preview{background:var(--white);border-radius:var(--radius);padding:1.25rem;border:1px solid var(--border);margin-bottom:1rem}
.pdf-header{background:var(--navy);border-radius:8px;padding:1rem;color:var(--white);text-align:center;margin-bottom:1rem}
.pdf-header h3{font-family:'DM Serif Display',serif;font-size:1rem}
.pdf-header p{font-size:0.72rem;color:rgba(255,255,255,0.7);margin-top:2px}
.pdf-row{display:flex;justify-content:space-between;font-size:0.82rem;padding:6px 0;border-bottom:1px dashed var(--border)}
.pdf-row:last-child{border-bottom:none}
.pdf-row span:first-child{color:var(--muted);font-weight:500}
.pdf-row span:last-child{font-weight:600;color:var(--text);text-align:right;max-width:60%}
.pdf-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0.75rem}
.pdf-photo{border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--cream);border:1px solid var(--border)}
.pdf-photo img{width:100%;height:100%;object-fit:cover}
.result-actions{display:flex;flex-direction:column;gap:10px}

/* ─── ADMIN ─── */
#screen-admin{background:var
